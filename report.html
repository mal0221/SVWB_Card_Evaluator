<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Shadowverse WB 評価一覧表</title>
  <style>
    body { font-family: "Helvetica Neue", Arial, sans-serif; background: #12141d; color: #f0f0f5; padding: 24px; margin: 0; }
    h1 { color: #d4af37; font-size: 22px; margin-bottom: 20px; border-bottom: 2px solid #323650; padding-bottom: 8px; }
    .class-section { margin-bottom: 30px; border-radius: 10px; overflow: hidden; border: 1px solid #323650; background: #1a1d2e; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .class-header { font-size: 16px; font-weight: bold; padding: 12px 16px; background: #252a40; color: #e6c665; border-bottom: 1px solid #323650; display: flex; align-items: center; gap: 10px; }
    .class-icon { width: 24px; height: 24px; object-fit: contain; }
    table { width: 100%; border-collapse: collapse; text-align: center; }
    th, td { padding: 10px 12px; border: 1px solid #2f354d; font-size: 14px; }
    th { background: #22263a; color: #c0c6de; font-weight: 600; }
    .card-name-cell { text-align: left; font-weight: bold; color: #ffffff; width: 35%; }
    .rank-cell { font-weight: bold; font-size: 16px; width: 10%; }
    .rank-badge { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 6px; border: 1px solid rgba(0,0,0,0.4); text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; }
    .rank-none { color: #6b7285; background: #161824; }
    .msg { color: #9da5b4; text-align: center; margin-top: 40px; font-size: 15px; }
  </style>
</head>
<body>
  <h1 id="page-title">📊 カード評価一覧表</h1>
  <div id="content-container"></div>
  <script src="report.js"></script>
</body>
</html>
